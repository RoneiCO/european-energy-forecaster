[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "european-energy-forecaster"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for European bidding zones"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pandas>=2.2",
    "entsoe-py>=0.6",
    "python-dotenv>=1.0",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]